packages:
  - 'apps/*'
  - 'packages/*'

# Pin a single copy of the React type packages across the workspace.
# Without this, transitive deps (e.g. Radix UI) pull an older @types/react,
# and multiple copies make forwardRef components fail as JSX element types.
overrides:
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.3'
  'body-parser@>=2.0.0 <2.3.0': '2.3.0'
  'brace-expansion@<1.1.16': '1.1.16'
  'brace-expansion@>=3.0.0 <5.0.7': '5.0.7'
  'esbuild@>=0.27.3 <0.28.1': '0.28.1'
  'fast-uri@>=3.0.0 <3.1.4': '3.1.4'
  # Transitive via prisma > @prisma/dev (dev tooling; not in the deployed
  # runtime). Advisories patched in find-my-way 9.7.0 and valibot 1.4.2.
  'find-my-way@<9.7.0': '9.7.0'
  'valibot@<1.4.2': '1.4.2'
  'js-yaml@<3.15.0': '3.15.0'
  'js-yaml@>=4.0.0 <4.3.0': '4.3.0'
  # GHSA-r28c-9q8g-f849 (source-map path traversal) covers <=8.5.17, so the
  # earlier <8.5.10→8.5.16 pin no longer clears it; bump the floor to 8.5.18.
  'postcss@<8.5.18': '8.5.18'
  'sharp@<0.35.0': '0.35.3'
